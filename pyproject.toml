[project]
name = "ends-of-reading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cycler>=0.12.1",
    "matplotlib>=3.10.8",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true

# Pipeline modules are imported bare (`from odds import ...`), resolving only via
# the script-directory / conftest `sys.path` entries. Name them so isort keeps them
# in their own block instead of filing them under third-party.
[tool.ruff.lint.isort]
known-first-party = [
    "atus",
    "atus_ed",
    "atus_prediction",
    "conftest",
    "ltt_extract",
    "odds",
    "plotting",
    "style",
]
